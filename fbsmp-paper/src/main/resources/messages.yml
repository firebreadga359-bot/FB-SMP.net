  repay:
    insufficient: "&cInsufficient funds."
    none: "&cNo active loan balance was found."
    posted: "&aLoan repayment posted: &6{amount}&a. Remaining: &6{remaining}"
  info:
    none: "&6Loans: &fno active loans."
    header: "&6Active loans:"
    timeout: "&cTimed out for &f{time}&c: {reason}"
