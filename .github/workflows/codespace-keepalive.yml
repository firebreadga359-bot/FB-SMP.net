name: Codespace keep-alive

# Keeps the FB-SMP Codespace host awake and serving the playit tunnels while the
# assistant's sandbox is idle or offline. Codespaces stop after ~30 minutes of
# inactivity, so this runs every 15 minutes: it starts the codespace if needed,
# pokes it with an SSH command (activity resets the idle timer), relaunches the
# keeper daemon if it died, and restarts playit if a public tunnel stops
# answering.
#
# Requires a repository secret CODESPACE_KEEPALIVE_TOKEN: a token with the
# `codespace` scope (classic PAT) or a fine-grained token with Codespaces: Read
# and write. The default GITHUB_TOKEN does NOT have codespace access.
# Optional: set FBSMP_CODESPACE to override the codespace name.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: codespace-keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CODESPACE_KEEPALIVE_TOKEN }}
      CS: ${{ vars.FBSMP_CODESPACE || 'fb-smp-24h-4qv59g697vjwcgjx' }}
      JAVA_ADDR: cairo-paste.tun.ply.gg:25565
      BEDROCK_ADDR: fried-toilette.tun.ply.gg:37298
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when no codespace token is configured
        if: ${{ env.GH_TOKEN == '' }}
        run: echo "CODESPACE_KEEPALIVE_TOKEN not set; skipping."

      - name: Install gh
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y gh >/dev/null

      - name: Start codespace if stopped
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          state="$(gh codespace list --json name,state -q ".[] | select(.name==\"$CS\") | .state" || true)"
          echo "state=$state"
          if [ -z "$state" ]; then echo "codespace '$CS' not found"; exit 0; fi
          if [ "$state" != "Available" ]; then
            gh codespace start -c "$CS" || true
          fi

      - name: Poke codespace (resets idle timer) and ensure keeper
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          gh codespace ssh -c "$CS" -- 'echo alive' || true
          # A resumed codespace has no init system, so nothing survives a stop.
          # The previous keeper can be gone with a stale pid file left behind,
          # and a non-interactive ssh does not run .bashrc. Always clear the
          # stale locks and relaunch the keeper so it reboots the whole stack.
          gh codespace ssh -c "$CS" -- '
            if pgrep -f fbsmp-keeper.sh >/dev/null; then
              echo "keeper already running"
            else
              cd /workspaces || exit 0
              pgrep -f fbsmp-keeper.sh >/dev/null && exit 0
              rm -f keeper.lock supervise.lock
              setsid nohup ./fbsmp-keeper.sh >>keeper.log 2>&1 </dev/null &
              sleep 4
              echo "keeper pids: $(pgrep -cf fbsmp-keeper.sh)"
            fi
          ' || true

      - name: Ensure admin panel port is public and bridge is up
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          gh codespace ports visibility 12000:public -c "$CS" || true
          if ! gh codespace ssh -c "$CS" -- 'curl -sf -o /dev/null --max-time 8 http://127.0.0.1:12000/health || curl -s -o /dev/null --max-time 8 http://127.0.0.1:12000/'; then
            echo "panel bridge not answering on 12000"
          else
            echo "panel bridge ok"
          fi

      - name: Ensure public panel tunnel
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          # A Codespaces container has no systemd, so the platform's own port
          # forwarding never starts. Publish the panel through a Cloudflare
          # quick tunnel instead; it survives without an init system.
          url="$(gh codespace ssh -c "$CS" -- '
            cd /workspaces || exit 0
            if [ ! -x ./cloudflared ]; then
              curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x cloudflared
            fi
            if [ -x ./fbsmp-panel-tunnel.sh ]; then ./fbsmp-panel-tunnel.sh; cat panel-url.txt 2>/dev/null; fi
          ' 2>/dev/null | tr -d "\r" | grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" | tail -1 || true)"
          echo "panel URL: $url"
          if [ -n "$url" ] && [ "$url" != "$(cat panel-url.txt 2>/dev/null)" ]; then
            printf '%s\n' "$url" > panel-url.txt
            git config user.name openhands
            git config user.email openhands@all-hands.dev
            git add panel-url.txt
            git commit -m "Update control-room address" || true
            git push || true
          fi

      - name: Ensure named panel tunnel (panel.fb-smp.net)
        if: ${{ env.GH_TOKEN != '' && env.CF_API_TOKEN != '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          # Stable hostname. Rebuilds the tunnel credentials from the API when a
          # fresh container has lost them, then (re)starts the tunnel. Secrets go
          # over stdin, never the remote command line.
          gh codespace cp -c "$CS" -e deploy/cf-named-tunnel-setup.sh remote:/workspaces/cf-named-tunnel-setup.sh || true
          gh codespace cp -c "$CS" -e deploy/fbsmp-named-tunnel.sh remote:/workspaces/fbsmp-named-tunnel.sh || true
          printf '%s\n%s\n%s\n' "$CF_API_TOKEN" "$CF_ACCOUNT_ID" "$CF_ZONE_ID" | \
          gh codespace ssh -c "$CS" -- '
            cd /workspaces || exit 0
            IFS= read -r CF_API_TOKEN; IFS= read -r CF_ACCOUNT_ID; IFS= read -r CF_ZONE_ID
            chmod +x ./cf-named-tunnel-setup.sh ./fbsmp-named-tunnel.sh 2>/dev/null
            if [ ! -x ./cloudflared ]; then
              curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x cloudflared
            fi
            [ -f ./cf-credentials.json ] || CF_API_TOKEN="$CF_API_TOKEN" CF_ACCOUNT_ID="$CF_ACCOUNT_ID" CF_ZONE_ID="$CF_ZONE_ID" bash ./cf-named-tunnel-setup.sh
            ./fbsmp-named-tunnel.sh
            echo "named tunnel processes: $(pgrep -cf credentials-file)"
          ' || true
          # Once the stable hostname actually serves the panel (DNS live), point
          # the site at it; until then keep the working quick-tunnel URL.
          if curl -sf -o /dev/null --max-time 15 https://panel.fb-smp.net/; then
            echo "panel.fb-smp.net is live"
            if [ "$(cat panel-url.txt 2>/dev/null)" != "https://panel.fb-smp.net" ]; then
              printf '%s\n' "https://panel.fb-smp.net" > panel-url.txt
              git config user.name openhands
              git config user.email openhands@all-hands.dev
              git add panel-url.txt
              git commit -m "Point the site at panel.fb-smp.net" || true
              git push || true
            fi
          else
            echo "panel.fb-smp.net not resolvable yet (zone pending at the registrar)"
          fi

      - name: Restart playit if a tunnel is down
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          ok() { curl -s --max-time 15 "https://api.mcstatus.io/v2/status/$1/$2" | grep -q '"online":true'; }
          if ok java "$JAVA_ADDR" && ok bedrock "$BEDROCK_ADDR"; then
            echo "both tunnels online"
          else
            echo "a tunnel is down; restarting playit in the codespace"
            gh codespace ssh -c "$CS" -- "pkill -f 'playit --socket' 2>/dev/null; sleep 2; cd /workspaces/playit-agent && setsid nohup ./playit --socket-path ./playit.sock --secret-path ./playit.toml >>daemon.log 2>&1 </dev/null &" || true
          fi
